plugins {
    id "com.android.application"
}

// Clé de signature : variables d'environnement (secrets GitHub) si présentes,
// sinon la clé fournie avec le projet (même clé à chaque fabrication = mises à jour possibles).
def cleFichier = System.getenv("SCOLARIS_KEYSTORE") ?: "scolaris-release.keystore"
def cleMdp = System.getenv("SCOLARIS_KEYSTORE_PASSWORD") ?: "gescol-benin"  // LEGACY-GESCOL : mot de passe réel de la clé fournie
def cleAlias = System.getenv("SCOLARIS_KEY_ALIAS") ?: "gescol"  // LEGACY-GESCOL : alias réel de la clé fournie
def cleAliasMdp = System.getenv("SCOLARIS_KEY_PASSWORD") ?: "gescol-benin"  // LEGACY-GESCOL : mot de passe réel de la clé fournie

android {
    namespace "bj.scolaris.app"
    compileSdk 34

    defaultConfig {
        applicationId "bj.scolaris.app"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.6.0"
    }

    signingConfigs {
        release {
            storeFile file(cleFichier)
            storePassword cleMdp
            keyAlias cleAlias
            keyPassword cleAliasMdp
            // v1.6 : signatures v1 + v2 + v3 (certains téléphones refusent un APK signé seulement en v2)
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
