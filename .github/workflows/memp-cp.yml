# Fabrique l'Application CP du MEMP (générale et CS Pobè) pour Android (.apk) et Windows (.exe), à partir des dépôts
# memp-cp-app et memp-cp-pobe : l'application web y est embarquée et fonctionne sans Internet.
# Publication : https://github.com/<compte>/scolaris/releases/tag/memp-cp (liens fixes, mis à jour à chaque fabrication)
#   …/releases/download/memp-cp/MEMP-CP.apk, MEMP-CP-Pobe.apk, MEMP-CP-Installation.exe, MEMP-CP-Pobe-Installation.exe
# Fabrication : à chaque modification de packaging/memp_cp, chaque nuit (pour reprendre les dernières mises à jour
# des applications), ou à la demande (onglet Actions > « Fabriquer MEMP CP » > Run workflow).
name: Fabriquer MEMP CP

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "packaging/memp_cp/**"
      - ".github/workflows/memp-cp.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - depot: memp-cp-app
            id: bj.memp.cp
            nom: MEMP CP
            fichier: MEMP-CP
          - depot: memp-cp-pobe
            id: bj.memp.cp.pobe
            nom: MEMP CP Pobè
            fichier: MEMP-CP-Pobe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.depot }}
          path: source-app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Embarquer l'application web
        run: |
          W=packaging/memp_cp/android/app/src/main/assets/www
          rm -rf "$W" && mkdir -p "$W"
          rsync -a --exclude .git --exclude .github --exclude tools source-app/ "$W/"
          V=$(grep -oP "version:\s*'\K[0-9.]+" source-app/js/config.js | head -1)
          echo "MEMP_VERSION_NOM=${V:-1.0}" >> "$GITHUB_ENV"
          echo "MEMP_VERSION_CODE=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          test -f "$W/index.html"
      - name: Clé de signature (même clé que SCOLARIS)
        env:
          KS_MDP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_MDP" ]; then echo "::error::Secret ANDROID_KEYSTORE_PASSWORD absent"; exit 1; fi
      - name: APK
        env:
          MEMP_APP_ID: ${{ matrix.id }}
          MEMP_APP_NOM: ${{ matrix.nom }}
          SCOLARIS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SCOLARIS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SCOLARIS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p packaging/memp_cp/android assembleRelease --no-daemon --stacktrace
          mkdir -p sortie
          cp packaging/memp_cp/android/app/build/outputs/apk/release/app-release.apk "sortie/${{ matrix.fichier }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MEMP-Android-${{ matrix.fichier }}
          path: sortie/*.apk

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - depot: memp-cp-app
            id: bj.memp.cp
            nom: MEMP CP
            fichier: MEMP-CP
            port: 8871
          - depot: memp-cp-pobe
            id: bj.memp.cp.pobe
            nom: MEMP CP Pobè
            fichier: MEMP-CP-Pobe
            port: 8872
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.depot }}
          path: source-app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Embarquer l'application web
        shell: pwsh
        run: |
          $w = "packaging/memp_cp/windows/www"
          if (Test-Path $w) { Remove-Item $w -Recurse -Force }
          Copy-Item source-app $w -Recurse
          foreach ($x in @(".git", ".github", "tools")) { if (Test-Path "$w/$x") { Remove-Item "$w/$x" -Recurse -Force } }
          $v = (Select-String -Path source-app/js/config.js -Pattern "version:\s*'([0-9.]+)'").Matches[0].Groups[1].Value
          if (-not $v) { $v = "1.0" }
          "MEMP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          '{"nom": "${{ matrix.nom }}", "port": ${{ matrix.port }}}' | Out-File -FilePath packaging/memp_cp/windows/variante.json -Encoding utf8NoBOM
      - name: Exécutable (PyInstaller)
        run: |
          pip install pyinstaller
          cd packaging/memp_cp/windows
          pyinstaller memp_cp.spec --noconfirm --distpath dist --workpath build
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          cd packaging/memp_cp/windows
          & $iscc "/DVersion=${env:MEMP_VERSION}" "/DNom=${{ matrix.nom }}" "/DFichier=${{ matrix.fichier }}" "/DId=${{ matrix.id }}" memp_cp.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a échoué" }
          New-Item -ItemType Directory -Force -Path ../../../sortie | Out-Null
          Copy-Item "../../../dist/${{ matrix.fichier }}-Installation-${env:MEMP_VERSION}.exe" "../../../sortie/${{ matrix.fichier }}-Installation.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: MEMP-Windows-${{ matrix.fichier }}
          path: sortie/*.exe

  publier:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
          merge-multiple: true
      - run: ls -la fichiers
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: memp-cp
          name: "Application CP du MEMP (Android et Windows)"
          make_latest: "false"
          files: fichiers/*
          body: |
            **Application CP du MEMP** (conseillers pédagogiques, CCS) — fonctionne sans Internet.
            **Android** : MEMP-CP.apk (application générale) · MEMP-CP-Pobe.apk (CS Pobè).
            **Windows** : MEMP-CP-Installation.exe · MEMP-CP-Pobe-Installation.exe.
            Fabriquée automatiquement chaque nuit avec la dernière version des applications.
